<!-- weak-flame-px.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="none"></rect>
  <!-- outline -->
  <rect x="7" y="2" width="2" height="1" fill="#7a2d00"></rect>
  <rect x="6" y="3" width="4" height="1" fill="#7a2d00"></rect>
  <rect x="5" y="4" width="6" height="1" fill="#7a2d00"></rect>
  <rect x="5" y="5" width="6" height="1" fill="#7a2d00"></rect>
  <rect x="4" y="6" width="8" height="1" fill="#7a2d00"></rect>
  <rect x="4" y="7" width="8" height="1" fill="#7a2d00"></rect>
  <rect x="4" y="8" width="8" height="1" fill="#7a2d00"></rect>
  <rect x="5" y="9" width="6" height="1" fill="#7a2d00"></rect>
  <rect x="5" y="10" width="6" height="1" fill="#7a2d00"></rect>
  <rect x="6" y="11" width="4" height="1" fill="#7a2d00"></rect>
  <rect x="7" y="12" width="2" height="1" fill="#7a2d00"></rect>

  <!-- flame body -->
  <rect x="7" y="3" width="2" height="1" fill="#ff7a00"></rect>
