  <rect x="6" y="5" width="4" height="1" fill="#ff7a00"></rect>
  <rect x="5" y="6" width="6" height="1" fill="#ff7a00"></rect>
  <rect x="5" y="7" width="6" height="1" fill="#ff7a00"></rect>
  <rect x="5" y="8" width="6" height="1" fill="#ff7a00"></rect>
  <rect x="6" y="9" width="4" height="1" fill="#ff7a00"></rect>
  <rect x="6" y="10" width="4" height="1" fill="#ff7a00"></rect>
  <rect x="7" y="11" width="2" height="1" fill="#ff7a00"></rect>

  <!-- inner hot core -->
  <rect x="7" y="5" width="2" height="1" fill="#ffd166"></rect>
  <rect x="6" y="6" width="4" height="1" fill="#ffd166"></rect>
  <rect x="6" y="7" width="4" height="1" fill="#ffd166"></rect>
  <rect x="7" y="8" width="2" height="1" fill="#ffd166"></rect>
