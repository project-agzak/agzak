# === Profile: dev ===
# SQL INIT
#   spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.sql.init.schema-locations=classpath:agzak_ddl.sql
spring.sql.init.data-locations=classpath:agzak_dml.sql

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agzak}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER:agzak}
spring.datasource.password=${MYSQL_PASSWORD:agzak102}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JPA
spring.jpa.show-sql=true
