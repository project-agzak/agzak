# === App & Server ===
spring:
  application:
    name: agzak-app-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

  docker:
    compose:
      enabled: false

  task:
    scheduling:
      pool:
        size: 2

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # === KakaoMap ===
  kakao:
    map:
      api:
        key: ${KAKAO_MAP_KEY}

# === Server ===
server:
  port: ${SPRING_PORT:8082}
  forward-headers-strategy: native

# === JWT ===
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  access-exp-minutes: ${ACCESS_EXP_MINUTES:60}
  refresh-exp-days: ${REFRESH_EXP_DAYS:14}

# === GMS LLM (proxy to OpenAI) ===
gms:
  enabled: true
  base-url: "https://gms.ssafy.io/gmsapi/api.openai.com/v1"
  api-key: ${GMS_API_KEY}
  timeout:
    ms: 5000
  model: gpt-4o

# === Swagger / OpenAPI ===
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    url: /v3/api-docs

# === Actuator exposure ===
management:
  endpoints:
    web:
      exposure:
        include: "*"

# === Logging ===
logging:
  file:
    path: ${LOG_FILE_PATH:backend/agzak/logs}
    name: ${LOG_FILE_NAME:agzak-app-server}
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace