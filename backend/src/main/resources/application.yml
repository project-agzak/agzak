# === App & Server ===
spring:
  application:
    name: agzak-app-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
  docker:
    compose:
      enabled: false
  task:
    scheduling:
      pool:
        size: 2
  ai:
    openai:
      api-key: DUMMY_KEY_TO_PREVENT_ERROR
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul            # JDBC timezone

  # === KakaoMap ===
  kakao:
    map:
      api:
        key: ${KAKAO_MAP_KEY}               # Kakao Map API key

server:
  port: ${SPRING_PORT:8082}                # Server port
  forward-headers-strategy: native         # Respect proxy headers (X-Forwarded-*)

# === GMS LLM (proxy to OpenAI) ===
gms:
  enabled: true
  base-url: "https://gms.ssafy.io/gmsapi/api.openai.com/v1"
  api-key: ${GMS_API_KEY}
  timeout:
    ms: 5000
  model: gpt-4o

# === Swagger / OpenAPI ===
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    url: /v3/api-docs

# === Actuator exposure ===
management:
  endpoints:
    web:
      exposure:
        include: "*"

# === Logging ===
logging:
  file:
    path: ${LOG_FILE_PATH:backend/agzak/logs}
    name: ${LOG_FILE_NAME:agzak-app-server}
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace