# App & Server
spring.application.name=agzak-app-server
server.port=${SPRING_PORT:8082}
server.forward-headers-strategy=native

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Time zone
spring.jackson.time-zone=Asia/Seoul

# Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# GMS LLM (proxy to OpenAI)
gms.enabled=true
gms.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
gms.api-key=${GMS_API_KEY}
gms.timeout.ms=5000
gms.model=gpt-4o


spring.ai.openai.api-key=DUMMY_KEY_TO_PREVENT_ERROR
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
>>>>>>> backend/src/main/resources/application.properties

# Disable Spring Boot Docker Compose integration
spring.docker.compose.enabled=false

# Scheduling
spring.task.scheduling.pool.size=2

# Swagger / OpenAPI
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/v3/api-docs

# Actuator exposure
management.endpoints.web.exposure.include=*

# KakaoMap
spring.kakao.map.api.key = ${KAKAO_MAP_KEY}

# OpenAI API key (for your app)
#spring.ai.openai.api-key=${OPENAI_API_KEY}

# Time zone
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Disable Spring Boot Docker Compose integration
spring.docker.compose.enabled=false
# Logging
logging.file.path=${LOG_FILE_PATH:backend/agzak/logs}
logging.file.name=${LOG_FILE_NAME:agzak-app-server}
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
