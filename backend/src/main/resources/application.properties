# App name and port
spring.application.name=backend
server.port=${SPRING_PORT:8082}

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Proxy / forwarded headers
server.forward-headers-strategy=native

## JWT
#jwt.secret=${JWT_SECRET}
#jwt.issuer=${JWT_ISSUER}
#jwt.signup-exp-minutes=${SIGNUP_EXP_MINUTES}
#jwt.access-exp-minutes=${ACCESS_EXP_MINUTES}
#jwt.refresh-exp-days=${REFRESH_EXP_DAYS}

## GMS LLM (proxy to OpenAI)
#gms.llm.enabled=true
#gms.llm.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
#gms.llm.api-key=${GMS_API_KEY}
#gms.llm.timeout.ms=5000
#gms.llm.model=gpt-4o-mini

## Spring AI (OpenAI) feature flags
#spring.ai.openai.enabled=false
#spring.ai.openai.chat.enabled=false
#spring.ai.openai.speech.enabled=false
#spring.ai.openai.audio.transcription.enabled=false
#spring.ai.openai.embedding.enabled=false

# Swagger / OpenAPI
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/v3/api-docs

