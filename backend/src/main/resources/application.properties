# App & Server
spring.application.name=agzak-app-server
server.port=${SPRING_PORT:8082}
server.forward-headers-strategy=native

# Time zone
spring.jackson.time-zone=Asia/Seoul

# JPA / Hibernate (defaults; override per profile if needed)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# Disable Spring Boot Docker Compose integration
spring.docker.compose.enabled=false

# Scheduling
spring.task.scheduling.pool.size=2

# Swagger / OpenAPI
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/v3/api-docs

# Actuator exposure
management.endpoints.web.exposure.include=*

# Logging
logging.file.path=${LOG_FILE_PATH:backend/agzak/logs}
logging.file.name=${LOG_FILE_NAME:agzak-app-server}
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

