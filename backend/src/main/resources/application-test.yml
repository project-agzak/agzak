spring:
  datasource:
    url: jdbc:h2:mem:coupon-test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  # 필요하면 여기서만 로깅 레벨도 낮춰줄 수 있음
  # logging:
  #   level:
  #     org.hibernate.SQL: debug

