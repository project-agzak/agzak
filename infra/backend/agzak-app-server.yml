version: '3.8'

services:
  agzak-app:
    image: "${IMAGE:-sso9594/agzak-app:latest}"
    container_name: agzak-app-server
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_PORT=8082
      - MYSQL_HOST=agzak-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=agzak
      - MYSQL_USER=agzak
      - MYSQL_PASSWORD=agzak102
    networks:
      - agzak-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health/readiness | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/log/agzak:/var/log/agzak
    restart: always

networks:
  agzak-network:
    external: true
    name: agzak-network