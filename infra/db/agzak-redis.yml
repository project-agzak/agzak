version: '3.8'

services:
  agzak-redis:
    image: redis:latest
    container_name: agzak-redis
    ports:
      - "6379:6379"
    networks:
      - agzak-network
    environment:
      TZ: "Asia/Seoul"
    restart: unless-stopped

networks:
  agzak-network:
    external: true
    name: agzak-network